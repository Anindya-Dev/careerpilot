# ==============================================================================
# CAREERPILOT PRODUCTION API GATEWAY & REVERSE PROXY CONFIGURATION
# Single Ingress entrypoint on Port 80 / 443 with path-based microservice routing
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream Microservice Definitions (Internal Docker DNS)
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream auth_upstream {
        server auth-service:5001;
        keepalive 32;
    }

    upstream profile_upstream {
        server profile-service:5002;
        keepalive 32;
    }

    upstream orchestrator_upstream {
        server agent-orchestrator:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost _;

        # Gateway Liveness Probe
        location /gateway-health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"careerpilot-production-gateway"}';
        }

        # ----------------------------------------------------------------------
        # 1. Auth Microservice API
        # ----------------------------------------------------------------------
        location /api/v1/auth/ {
            proxy_pass http://auth_upstream/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 2. Profile Microservice API
        # ----------------------------------------------------------------------
        location /api/v1/profile/ {
            proxy_pass http://profile_upstream/api/v1/profile/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 3. Agent Orchestrator & Telemetry API
        # ----------------------------------------------------------------------
        location /api/v1/orchestrator/ {
            proxy_pass http://orchestrator_upstream/api/v1/orchestrator/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
        }

        # ----------------------------------------------------------------------
        # 4. React SPA Frontend UI (Static Assets & Client-Side Routing)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
