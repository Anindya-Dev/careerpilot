version: '3.8'

# ==============================================================================
# CAREERPILOT: MASTER DOCKER COMPOSE ORCHESTRATION STACK
# Owner: Arik (Member 3 — DevOps & Platform Integration)
# Architecture: Multi-tier microservices with stateful data backends & MCP servers
# ==============================================================================

networks:
  careerpilot-network:
    name: careerpilot-network
    driver: bridge

volumes:
  mongo_data:
    name: careerpilot_mongo_data
  redis_data:
    name: careerpilot_redis_data
  neo4j_data:
    name: careerpilot_neo4j_data
  chroma_data:
    name: careerpilot_chroma_data

services:
  # ----------------------------------------------------------------------------
  # 1. STATEFUL DATA BACKENDS
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: cp-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret123}
    volumes:
      - mongo_data:/data/db
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    container_name: cp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  neo4j:
    image: neo4j:5.20-community
    container_name: cp-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  chromadb:
    image: chromadb/chroma:latest
    container_name: cp-chromadb
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - careerpilot-network
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. MODEL CONTEXT PROTOCOL (MCP) TOOL SERVERS
  # ----------------------------------------------------------------------------
  github-mcp:
    build:
      context: ../mcp-servers/github-mcp
      dockerfile: Dockerfile
    container_name: cp-github-mcp
    restart: unless-stopped
    ports:
      - "${GITHUB_MCP_PORT:-5005}:5005"
    environment:
      - PORT=5005
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OFFLINE_MODE=${MCP_OFFLINE_MODE:-false}
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  job-board-mcp:
    build:
      context: ../mcp-servers/job-board-mcp
      dockerfile: Dockerfile
    container_name: cp-job-board-mcp
    restart: unless-stopped
    ports:
      - "${JOB_BOARD_MCP_PORT:-5006}:5006"
    environment:
      - PORT=5006
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5006/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. CORE PLATFORM MICROSERVICES
  # ----------------------------------------------------------------------------
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: cp-auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-secret123}@mongodb:27017/careerpilot_auth?authSource=admin
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-your_super_secret_access_jwt_key_32_characters_minimum}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_super_secret_refresh_jwt_key_32_characters_minimum}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - BCRYPT_SALT_ROUNDS=12
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  profile-service:
    build:
      context: ../services/profile-service
      dockerfile: Dockerfile
    container_name: cp-profile-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-secret123}@mongodb:27017/careerpilot_profile?authSource=admin
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-your_super_secret_access_jwt_key_32_characters_minimum}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-careerpilot_internal_agent_secret_key_2026}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent-orchestrator:
    build:
      context: ../services/agent-orchestrator
      dockerfile: Dockerfile
    container_name: cp-agent-orchestrator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-placeholder_key}
      - HF_API_KEY=${HF_API_KEY:-}
      - GITHUB_MCP_URL=http://github-mcp:5005
      - JOB_BOARD_MCP_URL=http://job-board-mcp:5006
      - PROFILE_SERVICE_URL=http://profile-service:5002
      - INTERNAL_SERVICE_KEY=careerpilot_internal_agent_secret_key_2026
      - PYTHONPATH=/usr/src/app:/usr/src/app/agents
    volumes:
      - ../agents:/usr/src/app/agents:ro
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      github-mcp:
        condition: service_started
      job-board-mcp:
        condition: service_started
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_AUTH_API_URL=http://localhost:5001/api/v1/auth
      - VITE_PROFILE_API_URL=http://localhost:5002/api/v1/profile
      - VITE_ORCHESTRATOR_API_URL=http://localhost:8000/api/v1/orchestrator
    depends_on:
      - auth-service
      - profile-service
      - agent-orchestrator
    networks:
      - careerpilot-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
