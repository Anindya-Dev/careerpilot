apiVersion: v1
kind: ConfigMap
metadata:
  name: careerpilot-config
  namespace: careerpilot
data:
  NODE_ENV: "production"
  CLIENT_ORIGIN: "http://localhost:3000"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  JWT_ACCESS_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  BCRYPT_SALT_ROUNDS: "12"

  # Database URIs
  MONGO_URI_AUTH: "mongodb://careerpilot-mongodb:27017/careerpilot_auth"
  MONGO_URI_PROFILE: "mongodb://careerpilot-mongodb:27017/careerpilot_profile"
  REDIS_URL: "redis://careerpilot-redis:6379/0"
  NEO4J_URI: "bolt://careerpilot-neo4j:7687"
  NEO4J_USER: "neo4j"
  CHROMA_HOST: "careerpilot-chromadb"
  CHROMA_PORT: "8000"

  # MCP Services
  GITHUB_MCP_URL: "http://careerpilot-github-mcp:5005"
  JOB_BOARD_MCP_URL: "http://careerpilot-job-board-mcp:5006"
