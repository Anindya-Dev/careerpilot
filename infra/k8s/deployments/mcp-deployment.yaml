apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-mcp
  namespace: careerpilot
  labels:
    app: github-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-mcp
  template:
    metadata:
      labels:
        app: github-mcp
    spec:
      containers:
        - name: github-mcp
          image: careerpilot/github-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          env:
            - name: PORT
              value: "5005"
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: careerpilot-secrets
                  key: GITHUB_TOKEN
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 10
            periodSeconds: 15
---
