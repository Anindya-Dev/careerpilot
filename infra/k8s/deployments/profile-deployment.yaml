apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: careerpilot
  labels:
    app: profile-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: careerpilot/profile-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          envFrom:
            - configMapRef:
                name: careerpilot-config
            - secretRef:
                name: careerpilot-secrets
          env:
            - name: PORT
              value: "5002"
            - name: MONGO_URI
              value: "mongodb://admin:careerpilot_secure_password_2026@careerpilot-mongodb:27017/careerpilot_profile?authSource=admin"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
