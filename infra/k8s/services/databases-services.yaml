apiVersion: v1
kind: Service
metadata:
  name: careerpilot-mongodb
  namespace: careerpilot
spec:
  type: ClusterIP
  selector:
    app: careerpilot-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: careerpilot-redis
  namespace: careerpilot
spec:
  type: ClusterIP
  selector:
    app: careerpilot-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: careerpilot-neo4j
  namespace: careerpilot
spec:
  type: ClusterIP
  selector:
    app: careerpilot-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: v1
kind: Service
metadata:
  name: careerpilot-chromadb
  namespace: careerpilot
spec:
  type: ClusterIP
  selector:
    app: careerpilot-chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
