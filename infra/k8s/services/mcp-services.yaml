apiVersion: v1
kind: Service
metadata:
  name: careerpilot-github-mcp
  namespace: careerpilot
spec:
  type: ClusterIP
  selector:
    app: github-mcp
  ports:
    - name: http
      port: 5005
      targetPort: 5005
