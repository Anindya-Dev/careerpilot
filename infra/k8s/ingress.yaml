apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: careerpilot-ingress
  namespace: careerpilot
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # Auth Service API
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001

          # Profile Service API
          - path: /api/v1/profile
            pathType: Prefix
            backend:
              service:
                name: profile-service
                port:
                  number: 5002

          # Agent Orchestrator API
          - path: /api/v1/orchestrator
            pathType: Prefix
            backend:
              service:
                name: agent-orchestrator
                port:
                  number: 8000

          # React Frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
