openapi: 3.0.3
info:
  title: CareerPilot Profile Microservice API
  version: 1.0.0
  description: >
    OpenAPI 3.0 contract for CareerPilot Student Profile Service.
    Defines the Student Career Intelligence Profile contract aligned with Neo4j Knowledge Graph.
servers:
  - url: http://localhost:5002
    description: Local Development Server

paths:
  /health:
    get:
      summary: Liveness Probe
      responses:
        '200':
          description: Service is healthy.

  /ready:
    get:
      summary: Readiness Probe
      responses:
        '200':
          description: Database connected and ready.

  /api/v1/profile/me:
    get:
      summary: Get authenticated student profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Unauthorized.

    put:
      summary: Upsert student profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'

  /api/v1/profile/{userId}:
    get:
      summary: Internal service lookup by userId
      description: Ingested by Member 2 Agent Orchestrator during LangGraph execution.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: x-internal-key
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Profile data returned.
        '404':
          description: Profile not found.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Skill:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Python
        level:
          type: string
          example: advanced
        category:
          type: string
          example: Languages
        verified:
          type: boolean
          example: true

    Project:
      type: object
      required: [title]
      properties:
        title:
          type: string
          example: CareerPilot
        description:
          type: string
          example: AI career platform
        repo_url:
          type: string
          example: https://github.com/Anindya-Dev/careerpilot
        technologies:
          type: array
          items:
            type: string

    Certification:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: AWS Certified Cloud Practitioner
        issuer:
          type: string
          example: Amazon Web Services
        issue_date:
          type: string
          example: 2025-01

    ProfileUpdateRequest:
      type: object
      properties:
        target_role:
          type: string
          example: Machine Learning Engineer
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        goals:
          type: array
          items:
            type: string
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        certifications:
          type: array
          items:
            $ref: '#/components/schemas/Certification'
        linked_accounts:
          type: object
          properties:
            github:
              type: string
            linkedin:
              type: string

    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        profile:
          type: object
          properties:
            userId:
              type: string
            name:
              type: string
            email:
              type: string
            major:
              type: string
            target_role:
              type: string
            skills:
              type: array
              items:
                $ref: '#/components/schemas/Skill'
            goals:
              type: array
              items:
                type: string
            projects:
              type: array
              items:
                $ref: '#/components/schemas/Project'
            certifications:
              type: array
              items:
                $ref: '#/components/schemas/Certification'
            career_health_score:
              type: number
            profile_completeness:
              type: number
