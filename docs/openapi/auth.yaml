openapi: 3.0.3
info:
  title: CareerPilot Authentication Microservice API
  version: 1.0.0
  description: >
    Official OpenAPI 3.0 contract for the CareerPilot Auth Service owned by Member 1 (Md Hussain Ansari).
    Serves as the binding contract for Frontend Shell, Route Guards, and Teammate Integration.
servers:
  - url: http://localhost:5001
    description: Local Development Server

paths:
  /health:
    get:
      summary: Liveness Probe
      description: Returns health status of the authentication service.
      responses:
        '200':
          description: Service is healthy and operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      summary: Readiness Probe
      description: Verifies MongoDB connection readiness.
      responses:
        '200':
          description: Database connected and ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Database disconnected.

  /api/v1/auth/register:
    post:
      summary: Register a new student account
      description: Validates email, enforces 8-character min password, hashes via 12-round bcrypt, and returns tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Student account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          description: Validation error (weak password, invalid email).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (10 attempts / 15 mins).

  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials
      description: Verifies email & password against stored bcrypt hash, sets httpOnly cookie, and returns JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=eyJhbG...; HttpOnly; Path=/; Max-Age=604800
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded.

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      description: Consumes valid refresh token from cookie or body, invalidates it, and generates a new pair.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token rotated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Refresh token invalid, expired, or reused.

  /api/v1/auth/logout:
    post:
      summary: Invalidate user session
      description: Revokes refresh token in database and clears httpOnly cookie.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully.

  /api/v1/auth/me:
    get:
      summary: Fetch current authenticated user profile details
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized - Missing or invalid Bearer token.

  /api/v1/auth/forgot-password:
    post:
      summary: Request password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link generated and logged to server console.

  /api/v1/auth/reset-password:
    post:
      summary: Complete password reset using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated successfully.
        '400':
          description: Token invalid or expired.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
          example: student@careerpilot.io
        password:
          type: string
          format: password
          minLength: 8
          example: SecurePassword123!
        name:
          type: string
          example: Md Hussain Ansari
        major:
          type: string
          example: Computer Science & Engineering
        enrollmentYear:
          type: integer
          example: 2023

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: student@careerpilot.io
        password:
          type: string
          format: password
          example: SecurePassword123!

    UserResponse:
      type: object
      properties:
        id:
          type: string
          example: 6630f9a21e4a1a3a12345678
        userId:
          type: string
          example: 6630f9a21e4a1a3a12345678
        email:
          type: string
          example: student@careerpilot.io
        name:
          type: string
          example: Md Hussain Ansari
        major:
          type: string
          example: Computer Science & Engineering
        enrollmentYear:
          type: integer
          example: 2023
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: '#/components/schemas/UserResponse'
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
        service:
          type: string
          example: auth-service

    ReadyResponse:
      type: object
      properties:
        status:
          type: string
          example: ready
        database:
          type: string
          example: connected
        service:
          type: string
          example: auth-service
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_CREDENTIALS
            message:
              type: string
              example: Invalid email or password
