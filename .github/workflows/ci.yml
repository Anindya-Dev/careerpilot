name: CareerPilot CI Pipeline

# ==============================================================================
# CAREERPILOT CONTINUOUS INTEGRATION & VERIFICATION PIPELINE
# Owner: Arik (Member 3 — DevOps & Platform Integration)
# Matrix: Node.js Services, Python Orchestrator & MCPs, React Frontend, Docker
# ==============================================================================

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Node.js Microservices Test Suite (Auth & Profile)
  # ----------------------------------------------------------------------------
  test-node:
    name: Node.js Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/profile-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run Jest test suite (Asserting 100% passing)
        working-directory: ${{ matrix.service }}
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Python Agent Orchestrator, MCP Servers & Benchmark Evaluations
  # ----------------------------------------------------------------------------
  test-python:
    name: Python Orchestrator, MCP & Evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            services/agent-orchestrator/requirements.txt
            mcp-servers/github-mcp/requirements.txt
            mcp-servers/job-board-mcp/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/agent-orchestrator/requirements.txt
          pip install -r mcp-servers/github-mcp/requirements.txt
          pip install -r mcp-servers/job-board-mcp/requirements.txt

      - name: Run Agent Orchestrator Tests (13/13 passing)
        working-directory: services/agent-orchestrator
        env:
          PYTHONPATH: .
        run: pytest -v tests/

      - name: Run GitHub MCP Server Tests
        working-directory: mcp-servers/github-mcp
        env:
          PYTHONPATH: .
        run: pytest -v tests/

      - name: Run Job Board MCP Server Tests
        working-directory: mcp-servers/job-board-mcp
        env:
          PYTHONPATH: .
        run: pytest -v tests/

      - name: Run 20-Student Ground Truth Benchmark Evaluations
        run: python evaluations/run_evaluations.py

  # ----------------------------------------------------------------------------
  # Job 3: React Frontend SPA Production Build
  # ----------------------------------------------------------------------------
  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vite React production bundle
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 4: Multi-Container Docker Build Dry-Run Verification
  # ----------------------------------------------------------------------------
  docker-dry-run:
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [test-node, test-python, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: ./services/auth-service
            file: ./services/auth-service/Dockerfile
          - name: profile-service
            context: ./services/profile-service
            file: ./services/profile-service/Dockerfile
          - name: agent-orchestrator
            context: ./services/agent-orchestrator
            file: ./services/agent-orchestrator/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - name: github-mcp
            context: ./mcp-servers/github-mcp
            file: ./mcp-servers/github-mcp/Dockerfile
          - name: job-board-mcp
            context: ./mcp-servers/job-board-mcp
            file: ./mcp-servers/job-board-mcp/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: careerpilot/${{ matrix.name }}:ci-test
